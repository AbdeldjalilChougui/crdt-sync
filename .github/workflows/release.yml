# Release workflow: runs when a tag like v0.1.0 is pushed.
#
# Jobs:
#   publish-crate   publishes the `crdt-sync` crate to crates.io (secret CARGO_REGISTRY_TOKEN)

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish-crate:
    name: Publish crdt-sync to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check that the tag matches the crate version
        shell: bash
        run: |
          version=$(cargo pkgid -p crdt-sync | sed 's/.*[#@]//')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match crdt-sync version $version in Cargo.toml"
            exit 1
          fi
      - name: Test
        run: cargo test --locked
      - name: Publish
        run: cargo publish --locked -p crdt-sync
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
